<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>МАФ-конструктор Армаф</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  /* Инженерный пульт: холодная бумага, тушь, синий КОМПАС-акцент, древесный второй тон. Три колонки: объекты · чертёж · диалог */
  --paper: #eef1f4; --panel: #ffffff; --ink: #18202a; --muted: #5d6b7a; --line: #d6dde5;
  --accent: #2a5f95; --accent-ink: #ffffff; --wood: #b7793b; --ok: #2f7d4f; --warn: #a86a12;
  --soft: #f6f8fa; --user: #e4edf6;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --paper: #11161c; --panel: #171e26; --ink: #e5ebf1; --muted: #93a1b0; --line: #2a3542;
    --accent: #5f9bd6; --accent-ink: #0b1118; --wood: #d39a5e; --ok: #5fbf86; --warn: #e0a548; --soft: #1c242e; --user: #1f3044; color-scheme: dark; }
}
:root[data-theme="dark"] { --paper: #11161c; --panel: #171e26; --ink: #e5ebf1; --muted: #93a1b0; --line: #2a3542;
  --accent: #5f9bd6; --accent-ink: #0b1118; --wood: #d39a5e; --ok: #5fbf86; --warn: #e0a548; --soft: #1c242e; --user: #1f3044; color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--paper); color: var(--ink); font: 14px/1.45 var(--f-body); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { display: grid; grid-template-rows: auto 1fr; height: 100%; }
header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
.logo { font-weight: 600; letter-spacing: .01em; }
.logo b { color: var(--accent); }
.pill { font: 500 12px var(--f-mono); padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
.pill.warn { color: var(--warn); border-color: currentColor; }
header .sp { flex: 1; }
.cols { display: grid; grid-template-columns: 240px minmax(0, 1fr) 360px; min-height: 0; }
aside, main, .right { min-height: 0; overflow: auto; }
aside { border-right: 1px solid var(--line); padding: 14px; display: flex; flex-direction: column; gap: 18px; background: var(--panel); }
.right { border-left: 1px solid var(--line); background: var(--panel); display: grid; grid-template-rows: auto 1fr; }
h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
.list { display: flex; flex-direction: column; gap: 4px; }
.item { text-align: left; border: 1px solid transparent; background: none; padding: 7px 9px; border-radius: 6px; cursor: pointer; }
.item:hover { background: var(--soft); }
.item.on { border-color: var(--accent); background: var(--user); }
.item small { display: block; color: var(--muted); font: 12px var(--f-mono); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--soft); padding: 4px 9px; border-radius: 99px; cursor: pointer; font-size: 13px; }
.chip:hover { border-color: var(--accent); }
.btn { border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); padding: 7px 12px; border-radius: 6px; cursor: pointer; font-weight: 500; }
.btn.ghost { background: transparent; color: var(--accent); }
main { display: grid; grid-template-rows: auto minmax(360px, 1fr) auto; min-width: 0; }
.tabs { display: flex; gap: 2px; padding: 8px 12px 0; border-bottom: 1px solid var(--line); overflow-x: auto; background: var(--panel); min-height: 42px; flex-shrink: 0; }
.tabs > * { flex: 0 0 auto; }
.tab { border: none; background: none; padding: 8px 12px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
.tab.on { color: var(--ink); border-color: var(--accent); font-weight: 500; }
.view { position: relative; min-height: 0; overflow: auto; }
#v3d { position: absolute; inset: 0; }
#v3d canvas { display: block; }
.viewhint { position: absolute; left: 12px; bottom: 10px; font: 12px var(--f-mono); color: var(--muted); background: var(--panel); padding: 3px 7px; border-radius: 4px; border: 1px solid var(--line); }
.pane { padding: 16px; }
.zoombar { position: absolute; right: 12px; top: 10px; z-index: 5; display: flex; flex-direction: column; gap: 6px; }
.zoombar button { width: 40px; height: 40px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink, inherit); font: 600 22px/1 var(--f-mono, monospace); cursor: pointer; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.zoombar button:hover { border-color: var(--accent, #2a5d94); }
.zoombar .zl { font-size: 11px; text-align: center; color: var(--muted); background: var(--panel); border-radius: 4px; padding: 2px 0; }
.zoomwrap { overflow: auto; max-height: 75vh; border-radius: 4px; touch-action: pan-x pan-y pinch-zoom; }
.zoomwrap .sheet, .zoomwrap img { max-width: none; margin: 0; }
.zfig { position: relative; }
.compose .clip { padding: 0 12px; font-size: 18px; align-self: stretch; }
.attach { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px 12px 0; }
.attach .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; background: var(--panel); }
.attach .chip img { width: 28px; height: 28px; object-fit: cover; border-radius: 3px; }
.attach .chip button { border: 0; background: none; cursor: pointer; font-size: 14px; color: var(--muted); }
#aiPill { cursor: pointer; font: inherit; }
#aiPill.on { color: #1d7a3a; border-color: #8fd0a2; background: #effaf2; }
.msg .thumbs { display: flex; gap: 6px; margin-top: 6px; } .msg .thumbs img { width: 64px; height: 64px; object-fit: cover; border-radius: 4px; border: 1px solid var(--line); }
.aibox { display: flex; gap: 6px; margin-top: 8px; } .aibox input { flex: 1; font: 14px var(--f-mono, monospace); padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; }
.drawbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 0 0 10px; }
.drawbar .btn { padding: 6px 10px; font-size: 13px; }
.drawhint { font-size: 12px; color: var(--muted); margin-left: 4px; }
.files .sh { display: none; }
@media (max-width: 700px) { .drawbar .tl, .drawhint { display: none; } .drawbar .btn { padding: 6px 12px; font-size: 18px; } .files { gap: 6px; } .files b { display: none; } .files .lg { display: none; } .files .sh { display: inline !important; } .files .btn { padding: 6px 10px; font-size: 13px; } main { grid-template-rows: auto 68vh auto !important; } .pane { padding: 10px; } }
.sheet { background: #fff; border: 1px solid var(--line); border-radius: 4px; max-width: 1100px; margin: 0 auto; }
.sheet svg { display: block; width: 100%; height: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
th { font-size: 12px; color: var(--muted); font-weight: 500; }
td.n, th.n { text-align: right; font-family: var(--f-mono); }
.mono { font-family: var(--f-mono); }
.summary { display: flex; flex-wrap: wrap; gap: 18px; padding: 10px 16px; border-top: 1px solid var(--line); background: var(--panel); align-items: baseline; }
.kpi b { font: 600 18px var(--f-mono); }
.kpi span { color: var(--muted); font-size: 12px; margin-left: 4px; }
.asm { padding: 0 16px 12px; background: var(--panel); color: var(--muted); font-size: 13px; }
.asm li { margin: 2px 0; }
.rtabs { display: flex; border-bottom: 1px solid var(--line); }
.rtabs .tab { flex: 1; }
.chat { display: grid; grid-template-rows: 1fr auto; min-height: 0; }
.log { overflow: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.msg { padding: 9px 11px; border-radius: 8px; white-space: pre-wrap; max-width: 95%; }
.msg.user { background: var(--user); align-self: flex-end; }
.msg.bot { background: var(--soft); border: 1px solid var(--line); }
.msg .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; white-space: normal; }
.msg .acts button { font-size: 12px; padding: 4px 8px; border-radius: 5px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; }
.msg .acts button:hover { border-color: var(--accent); }
.msg .acts.kinds button { font-size: 13px; padding: 6px 10px; }
.msg.hasform { max-width: 100%; }
.fform { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px 10px; margin-top: 10px; white-space: normal; }
.fform .ff { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
.fform .ff input, .fform .ff select { font: 14px var(--f-mono, monospace); padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: inherit; min-width: 0; }
.fform .ff.ask span { color: #9a5b00; font-weight: 600; }
.fform .ff.ask input, .fform .ff.ask select { border-color: #e0a84a; background: #fff8ec; }
.fform .fbtns { grid-column: 1 / -1; }
.fform .fsample { grid-column: 1 / -1; font-size: 12px; color: var(--muted); }
.formdone { margin-top: 6px; font-size: 12px; color: var(--muted); }
.compose { border-top: 1px solid var(--line); padding: 10px; display: flex; gap: 8px; }
.compose textarea { flex: 1; resize: none; height: 64px; border: 1px solid var(--line); border-radius: 6px; padding: 8px; background: var(--paper); }
.params { padding: 12px; display: grid; gap: 10px; overflow: auto; }
.params label { display: grid; gap: 3px; font-size: 12px; color: var(--muted); }
.params input, .params select { border: 1px solid var(--line); border-radius: 5px; padding: 6px 8px; background: var(--paper); font-family: var(--f-mono); font-size: 13px; }
.prices { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; margin: 0 0 16px; }
.prices label { display: grid; gap: 3px; font-size: 12px; color: var(--muted); }
.prices input { border: 1px solid var(--line); border-radius: 5px; padding: 5px 7px; background: var(--paper); font-family: var(--f-mono); }
.bar { font: 13px var(--f-mono); padding: 4px 0; border-bottom: 1px dashed var(--line); }
.bar .rest { color: var(--ok); } .bar .scrap { color: var(--warn); }
.samples { display: grid; gap: 16px; }
.samples figure { margin: 0; background: #fff; border: 1px solid var(--line); border-radius: 4px; padding: 6px; }
.samples img { width: 100%; height: auto; display: block; }
.samples figcaption { font-size: 12px; color: #333; padding: 6px 4px 2px; }
.files { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; max-width: 1100px; margin: 0 auto 12px; }
.files b { margin-right: 4px; }
.note { font-size: 13px; color: var(--muted); max-width: 70ch; }
@media (max-width: 1100px) { .cols { grid-template-columns: 200px minmax(0, 1fr); } .right { grid-column: 1 / -1; border-left: none; border-top: 1px solid var(--line); max-height: 70vh; } }
@media (max-width: 700px) { .cols { grid-template-columns: 1fr; } main { order: 1; grid-template-rows: auto 55vh auto; } .right { order: 2; max-height: none; } aside { order: 3; border-right: none; border-top: 1px solid var(--line); } header .pill:not(.warn) { display: none; } }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">МАФ·<b>конструктор</b></div>
    <span class="pill">Армаф · Севастополь</span>
    <span class="sp"></span>
    <button type="button" class="pill warn" id="aiPill" title="ИИ читает свободный текст, эскизы, фото и PDF">ИИ: подключить</button>
  </header>
  <div class="cols">
    <aside>
      <div>
        <h2>Мои объекты</h2>
        <div class="list" id="objects"></div>
        <button class="btn ghost" id="newObj" style="margin-top:8px;width:100%">+ Новый объект</button>
      </div>
      <div>
        <h2>Версии</h2>
        <div class="list" id="versions"></div>
      </div>
      <div>
        <h2>Попробуйте</h2>
        <div class="chips" id="examples"></div>
      </div>
    </aside>
    <main>
      <nav class="tabs" id="tabs"></nav>
      <section class="view" id="view">
        <div id="v3d"></div>
        <div class="zoombar" id="zoom3d"><button type="button" data-z3="in" aria-label="Приблизить" title="Приблизить">+</button><button type="button" data-z3="out" aria-label="Отдалить" title="Отдалить">−</button><button type="button" data-z3="fit" aria-label="Вписать" title="Вписать" style="font-size:16px">⤢</button></div>
        <div class="viewhint" id="hint">Вращать — мышь / палец · Масштаб — колесо / щипок</div>
        <div id="pane" class="pane" hidden></div>
      </section>
      <div>
        <div class="summary" id="summary"></div>
        <ul class="asm" id="asm"></ul>
      </div>
    </main>
    <section class="right">
      <div class="rtabs"><button class="tab on" data-r="chat" id="rt-chat">Диалог</button><button class="tab" data-r="params" id="rt-params">Параметры</button></div>
      <div id="rpane-chat" class="chat">
        <div class="log" id="log"></div>
        <div class="attach" id="attach" hidden></div>
        <div class="compose">
          <button type="button" class="btn ghost clip" id="clip" title="Приложить эскиз, фото или PDF" aria-label="Приложить файл">📎</button>
          <input type="file" id="file" accept="image/*,application/pdf" multiple hidden>
          <textarea id="input" placeholder="Что начертить или поправить? Например: «стойки 80х80», «добавь спинку», «шаг ламелей 250»"></textarea>
          <button class="btn" id="send">Отправить</button>
        </div>
      </div>
      <div id="rpane-params" class="params" hidden></div>
    </section>
  </div>
</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
// ===== МАФ-ядро (порт Python-ядра mafbot): сортамент, модель, шаблоны, раскрой, смета, разбор текста =====
const ENG = (() => {
const STEEL = 7850, WOOD = 520, CONC = 2400;
const PROD = { steelStocks: [6000, 12000], kerfSteel: 3, minRemSteel: 400, kerfWood: 4, minRemWood: 200,
  board: [200, 50, 6000], allowW: 5, allowT: 5 };
const PRICES = { steel_profile_rub_kg: 95, steel_sheet_rub_kg: 90, profsheet_rub_m2: 650, wood_rub_m3: 32000,
  concrete_rub_m3: 7500, rebar_rub_kg: 85, rebar_kg_m3: 60, formwork_rub_m2: 450, fabrication_rub_kg: 70,
  painting_rub_m2: 550, wood_work_rub_m3: 15000, wood_finish_rub_m2: 350, concrete_work_rub_m3: 6000,
  roof_rub_m2: 1100, hardware_pct: 3, overhead_pct: 15, margin_pct: 25 };
const CHANNELS = { "8П": [80, 40, 4.5, 7.05], "10П": [100, 46, 4.5, 8.59], "12П": [120, 52, 4.8, 10.4], "14П": [140, 58, 4.9, 12.3] };

const nums = s => (s.match(/\d+(?:[.,]\d+)?/g) || []).map(x => parseFloat(x.replace(",", ".")));
const g = v => +(+v).toFixed(2) + "";

function parse(code) {
  const raw = code.trim();
  const s = raw.toLowerCase().replace(/[×х]/g, "x");
  let n = nums(s);
  const S = (o) => Object.assign({ t: 0, gost: "" }, o);
  if (/^(пт|профтруба|профиль)/.test(s)) {
    if (n.length === 2) n = [n[0], n[0], n[1]];
    const [h, b, t] = n;
    return S({ code: `ПТ ${g(h)}x${g(b)}x${g(t)}`, kind: "rect_tube", mat: "steel", w: b, h, t,
      area: 2 * t * (h + b - 2 * t) - (4 - Math.PI) * t * t * 0.5, gost: "ГОСТ 30245-2003" });
  }
  if (/^профлист/.test(s)) {
    const t = n[n.length - 1] || 0.5;
    return S({ code: `Профлист С8 ${g(t)}`, kind: "sheet", mat: "steel", w: 0, h: 0, t, kgm2: 4.7 * t / 0.5, gost: "ГОСТ 24045-2016" });
  }
  if (/^труба/.test(s)) { const [d, t] = n; return S({ code: `Труба ${g(d)}x${g(t)}`, kind: "round_tube", mat: "steel", w: d, h: d, t, area: Math.PI * t * (d - t), gost: "ГОСТ 10704-91" }); }
  if (/^уголок/.test(s)) {
    let b1, b2, t; if (n.length === 2) { b1 = b2 = n[0]; t = n[1]; } else [b1, b2, t] = n;
    return S({ code: b1 === b2 ? `Уголок ${g(b1)}x${g(t)}` : `Уголок ${g(b1)}x${g(b2)}x${g(t)}`, kind: "angle", mat: "steel", w: b2, h: b1, t, area: t * (b1 + b2 - t), gost: "ГОСТ 8509-93" });
  }
  if (/^швеллер/.test(s)) { const k = g(n[0]) + "П"; const c = CHANNELS[k] || CHANNELS["10П"]; return S({ code: `Швеллер ${k}`, kind: "channel", mat: "steel", w: c[1], h: c[0], t: c[2], area: c[3] / STEEL * 1e6, gost: "ГОСТ 8240-97" }); }
  if (/^полоса/.test(s)) { const [b, t] = n; return S({ code: `Полоса ${g(b)}x${g(t)}`, kind: "strip", mat: "steel", w: b, h: t, t, area: b * t, gost: "ГОСТ 103-2006" }); }
  if (/^лист/.test(s)) { const t = n[0]; return S({ code: `Лист ${g(t)}`, kind: "plate", mat: "steel", w: 0, h: 0, t, area: 0, gost: "ГОСТ 19903-2015" }); }
  if (/^(круг|пруток|арматура)/.test(s)) { const d = n[0]; return S({ code: `Круг ${g(d)}`, kind: "rod", mat: "steel", w: d, h: d, t: d, area: Math.PI * d * d / 4, gost: "ГОСТ 2590-2006" }); }
  if (/^(брус|доска|рейка)/.test(s)) {
    const [a, b] = n; const nm = s.startsWith("брус") ? "Брус" : s.startsWith("доска") ? "Доска" : "Рейка";
    return S({ code: `${nm} ${g(a)}x${g(b)}`, kind: "timber", mat: "wood", w: a, h: b, area: a * b, gost: "ГОСТ 8486-86" });
  }
  if (/^бетон/.test(s)) { const m = s.match(/[мm]\s*(\d+)/); return S({ code: `Бетон М${m ? m[1] : 300}`, kind: "concrete", mat: "concrete", w: 0, h: 0, area: 0, gost: "ГОСТ 26633-2015" }); }
  throw new Error(`Не понял профиль «${raw}»`);
}
const isBoxKind = k => k === "plate" || k === "concrete" || k === "sheet";
const kgm = sec => sec.area * 1e-6 * (sec.mat === "steel" ? STEEL : sec.mat === "wood" ? WOOD : CONC);
const perim = sec => (sec.kind === "round_tube" || sec.kind === "rod") ? Math.PI * sec.w : 2 * (sec.w + sec.h);

// ---- векторная математика
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]], add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const mul = (a, k) => [a[0] * k, a[1] * k, a[2] * k], dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const len = a => Math.hypot(a[0], a[1], a[2]), norm = a => mul(a, 1 / len(a));

function El(name, profile, start, end, o = {}) { return Object.assign({ name, profile, start, end: end || start, size: null, rot_z: 0, roll: 0, holes: [] }, o); }
function info(e) {
  if (!e._s) e._s = parse(e.profile);
  return e._s;
}
function boxSize(e) { const s = info(e); const [x, y, z] = e.size; return s.kind === "plate" ? [x, y, s.t] : [x, y, z]; }
function elLen(e) { return isBoxKind(info(e).kind) ? 0 : len(sub(e.end, e.start)); }
function frame(e) {
  if (isBoxKind(info(e).kind)) { const c = Math.cos(e.rot_z * Math.PI / 180), s = Math.sin(e.rot_z * Math.PI / 180); return [[0, 0, 1], [c, s, 0], [-s, c, 0]]; }
  const a = norm(sub(e.end, e.start));

// ---------- состояние
let S = load() || { objects: [], cur: null, prices: { ...ENG.PRICES } };
function save() { try { localStorage.setItem("maf-demo", JSON.stringify(S)); } catch (e) {} }
function load() { try { return JSON.parse(localStorage.getItem("maf-demo")); } catch (e) { return null; } }
const obj = () => S.objects.find(o => o.id === S.cur);
const spec = () => { const o = obj(); return o && o.versions[o.v]; };
let prod = null, tab = "3d";

function newObject(title) { const o = { id: Date.now() + "" + Math.random().toString(36).slice(2, 6), title, versions: [], v: -1, log: [] }; S.objects.unshift(o); S.cur = o.id; return o; }
function addVersion(sp) { const o = obj(); o.versions = o.versions.slice(0, o.v + 1); o.versions.push(sp); o.v = o.versions.length - 1; o.title = ENG.build(sp.kind, sp.params).title; }

function botReply(sp, changes, t0) {
  const r = ENG.build(sp.kind, sp.params), t = ENG.totals(r), est = ENG.estimate(r, S.prices);
  let s = `✅ Готово — ${r.title}\nДеталей ${t.parts}, позиций ${ENG.positions(r).length}, вес ${fmt(t.total, 1)} кг\nОриентировочная цена ${fmt(est.price)} ₽`;
  if (changes) s += "\n\nИзменено:\n" + changes.map(c => "• " + c).join("\n");
  s += "\n\nПринято при чтении:\n" + r.asm.slice(0, 5).map(a => "• " + a).join("\n") + "\n\nЧтобы поправить — напишите, что изменить.";
  return s;
}
function send(text) {
  text = text.trim(); const files = PENDING; if (!text && !files.length) return;
  if (files.length) { PENDING = []; renderAttach(); if (aiReady()) { sendAI(text, files); return; } askCode("Читать эскизы, фото и PDF умеет только ИИ."); return; }
  if (aiReady() && !ENG.interpret(text, spec())) { sendAI(text, []); return; }
  const t0 = performance.now();
  let o = obj(); const cur = spec();
  const res = ENG.interpret(text, cur);
  if (!o || (res && !res.changes && cur)) o = newObject("Новый объект");
  o.log.push({ who: "user", text });
  if (!res) {
    o.log.push({ who: "bot", text: cur ? "Не понял правку. Выберите изделие — покажу форму, или поправьте текущее через «📝 Форма»." : "Не понял, что начертить. Выберите изделие — покажу форму для заполнения:", choose: true, formcur: !!cur });
  } else if (!res.changes && missingCore(res.kind, res.params).length) {
    pushForm(o, res.kind, res.params, missingCore(res.kind, res.params));
  } else {
    try { ENG.build(res.kind, res.params); } catch (e) { o.log.push({ who: "bot", text: "Ошибка в параметрах: " + e.message }); save(); render(); return; }
    addVersion({ kind: res.kind, params: res.params });
    o.log.push({ who: "bot", text: botReply(spec(), res.changes, t0), acts: true });
  }
  save(); render();
}

  if (!sp) { box.innerHTML = '<p class="note">Нет объекта.</p>'; return; }
  const p = Object.assign({}, ENG.DEF[sp.kind], sp.params);
  box.innerHTML = `<p class="note">${ENG.KIND_TITLE[sp.kind]} · правка любого поля создаёт новую версию.</p>` + Object.keys(ENG.DEF[sp.kind]).map(k => {
    const v = p[k], id = "par-" + k;
    if (k === "shape" && ENG.SHAPES[sp.kind]) return `<label for="${id}">${ENG.LABELS[k]}<select id="${id}" data-k="${k}">${ENG.SHAPES[sp.kind].map(o => `<option ${String(v) === o ? "selected" : ""}>${o}</option>`).join("")}</select></label>`;
    if (OPTS[k]) { const o = OPTS[k].map(x => Array.isArray(x) ? x : [x, x]); if (!o.some(x => String(x[0]) === String(v))) o.unshift([v, v]); return `<label for="${id}">${ENG.LABELS[k] || k}<select id="${id}" data-k="${k}">${o.map(([val, t]) => `<option value="${esc(val)}" ${String(val) === String(v) ? "selected" : ""}>${esc(t)}</option>`).join("")}</select></label>`; }
    if (typeof ENG.DEF[sp.kind][k] === "boolean") return `<label for="${id}">${ENG.LABELS[k] || k}<select id="${id}" data-k="${k}"><option value="true" ${v === true || v === "true" ? "selected" : ""}>да</option><option value="false" ${!(v === true || v === "true") ? "selected" : ""}>нет</option></select></label>`;
    return `<label for="${id}">${ENG.LABELS[k] || k}<input id="${id}" data-k="${k}" value="${esc(v)}"></label>`;
  }).join("");
}
function render() {
  const o = obj(), sp = spec();
  $("#objects").innerHTML = S.objects.map(x => `<button class="item ${x.id === S.cur ? "on" : ""}" data-o="${x.id}">${esc(x.title)}<small>версий: ${x.versions.length}</small></button>`).join("") || '<p class="note">Пока пусто</p>';
  $("#versions").innerHTML = o ? o.versions.map((v, i) => `<button class="item ${i === o.v ? "on" : ""}" data-v="${i}">v${i + 1}<small>${esc(ENG.build(v.kind, v.params).title)}</small></button>`).join("") : "";
  $("#log").innerHTML = o ? o.log.map((m, mi) => `<div class="msg ${m.who}${m.form ? " hasform" : ""}">${esc(m.text)}${(m.thumbs || []).length ? `<div class="thumbs">${m.thumbs.map(u => `<img src="${u}" alt="вложение">`).join("")}</div>` : ""}${m.aicode ? `<div class="aibox"><input type="password" placeholder="Код доступа" autocomplete="off" aria-label="Код доступа"><button type="button" class="btn" data-aicodeok>OK</button></div>` : ""}${m.choose ? `<div class="acts kinds">${KIND_BTN.map(([k, n]) => `<button data-fk="${k}">${n}</button>`).join("")}${m.formcur ? `<button data-formcur>📝 Форма текущего</button>` : ""}</div>` : ""}${m.form ? formHTML(m, mi) : ""}${m.acts ? `<div class="acts"><button data-go="3d">3D</button><button data-go="sheet">Чертёж</button><button data-go="spec">Спецификация</button><button data-go="cut">Раскрой</button><button data-go="cost">Смета</button><button data-file="sb">⬇ DXF для КОМПАС</button><button data-formcur>📝 Форма</button></div>` : ""}</div>`).join("") : "";
  $("#log").scrollTop = 1e9;
  prod = sp ? ENG.build(sp.kind, sp.params) : null;
  if (prod) {
    const t = ENG.totals(prod), e = ENG.estimate(prod, S.prices);
    $("#summary").innerHTML = `<div class="kpi"><b>${esc(prod.title)}</b></div><div class="kpi"><b>${fmt(t.total, 1)}</b><span>кг</span></div><div class="kpi"><b>${t.parts}</b><span>деталей</span></div><div class="kpi"><b>${fmt(e.price)}</b><span>₽ ориентир</span></div><div class="kpi"><b>${fmt(e.cost)}</b><span>₽ себестоимость</span></div>`;
    $("#asm").innerHTML = prod.asm.map(a => `<li>${esc(a)}</li>`).join("");
    draw3d(prod);
  } else {
    if (R3) while (R3.group.children.length) { const c = R3.group.children.pop(); c.geometry && c.geometry.dispose(); }
    $("#summary").innerHTML = `<div class="kpi"><b>${o ? "Заполните форму в диалоге" : "Нет объекта"}</b></div>`; $("#asm").innerHTML = "";
  }
  renderTabs(); renderPane(); renderParams();
}

// ---------- события
document.addEventListener("click", ev => {
  const b = ev.target.closest("button"); if (!b) return;
  if (b.dataset.t) { tab = b.dataset.t; renderTabs(); renderPane(); }
  if (b.dataset.go) { tab = b.dataset.go; renderTabs(); renderPane(); }
  if (b.dataset.file) getFile(b.dataset.file);
  if (b.dataset.o) { S.cur = b.dataset.o; save(); render(); }
  if (b.dataset.v) { obj().v = +b.dataset.v; save(); render(); }
  if (b.dataset.ex) { S.cur = null; send(EXAMPLES[+b.dataset.ex][1]); }
  if (b.dataset.r) { document.querySelectorAll(".rtabs .tab").forEach(x => x.classList.toggle("on", x === b)); $("#rpane-chat").hidden = b.dataset.r !== "chat"; $("#rpane-params").hidden = b.dataset.r !== "params"; }
});
$("#send").onclick = () => { const v = $("#input").value; $("#input").value = ""; send(v); };
$("#input").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("#send").click(); } });
$("#newObj").onclick = () => { S.cur = null; newObject("Новый объект").log.push({ who: "bot", text: "Новый объект. Опишите изделие текстом: тип, размеры, профили. Например: «Скамья 2000 на бетоне, рейки 88х40»." }); save(); render(); };
$("#rpane-params").addEventListener("change", ev => {
  const k = ev.target.dataset.k; if (!k) return; const sp = spec(); let v = ev.target.value;
  if (v === "true" || v === "false") v = v === "true"; else if (/^-?\d+([.,]\d+)?$/.test(v)) v = parseFloat(v.replace(",", "."));
  const params = Object.assign({}, sp.params, { [k]: v });
  try { ENG.build(sp.kind, params); } catch (e) { alertMsg("Ошибка: " + e.message); return; }
  addVersion({ kind: sp.kind, params }); obj().log.push({ who: "bot", text: `✏️ Изменено в параметрах: ${ENG.LABELS[k] || k} → ${v}`, acts: true }); save(); render();
});
function alertMsg(t) { obj().log.push({ who: "bot", text: t }); render(); }
$("#pane").addEventListener("change", ev => { const k = ev.target.dataset.pk; if (!k) return; S.prices[k] = parseFloat(ev.target.value) || 0; save(); render(); });
$("#examples").innerHTML = EXAMPLES.map(([n], i) => `<button class="chip" data-ex="${i}">${n}</button>`).join("");

init3d(); aiPillRender();
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.closest(".aibox")) { e.preventDefault(); e.target.closest(".aibox").querySelector("[data-aicodeok]").click(); } });
try {
  const m = location.hash.match(/^#spec=(.+)$/);
  if (m) { const sp = JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(m[1]))))); if (sp && ENG.DEF[sp.kind]) { newObject(""); addVersion({ kind: sp.kind, params: sp.params || {} }); obj().log.push({ who: "bot", text: "Изделие открыто из Telegram. Файлы для КОМПАС — на вкладке «Чертёж и файлы»." }); tab = "sheet"; save(); } history.replaceState(null, "", location.pathname); }
} catch (e) {}
if (!S.objects.length) { send(EXAMPLES[0][1]); send("стойки 80х80, шаг ламелей 250"); S.cur = null; send(EXAMPLES[2][1]); S.cur = S.objects[1].id; }
render();
</script>
</body>
</html>
